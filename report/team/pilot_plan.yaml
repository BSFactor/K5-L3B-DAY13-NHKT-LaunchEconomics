# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (DE = 1).
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 yêu cầu và 42 nhân viên mỗi nhóm, cần 84 người trong khi có khoảng 40.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 mỗi nhóm, thấp hơn 1.251: không đạt.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300 mỗi nhóm, và chỉ 6 cụm (dưới 20): loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: ít nhất 299 yêu cầu mỗi nhân viên (DE = 6,96).
#
# Ước tính thời gian gom mẫu nếu chia 20 nhân viên mỗi nhóm:
#   20 x 299 = 5.980 yêu cầu thực tế mỗi nhóm, tương đương khoảng 859 ca hiệu dụng.
#   Toàn hệ thống: 1.500 yêu cầu/ngày / 40 người = 37,5 yêu cầu/người/ngày.
#   Phạm vi noi_dia + hang_nang: 37,5 x 982/1.200 = 30,69 yêu cầu/người/ngày.
#   Giả định lưu lượng và cơ cấu loại yêu cầu ổn định, tải chia đều: 299 / 30,69 ≈ 9,74 ngày, làm tròn lên 10 ngày.
#   Chờ thêm 7 ngày kể từ ca cuối để chỉ số mở lại đủ thời gian theo dõi, tức khoảng 17 ngày từ bước đủ 20 người mỗi nhóm.
#   Kiểm số ca thực tế theo từng nhân viên ở cả hai nhóm trước khi chốt ngày đọc kết quả.
#
# Cách chia đã chọn: theo nhân viên (staff), 20 người dùng trợ lý + 20 người đối chứng, phân tầng theo depot.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng các depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot; quản lý depot không được chọn người.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên đối chứng xin câu trả lời của đồng nghiệp cùng depot; giảm bằng cấp quyền trợ lý theo tài khoản và log lượt mở trợ lý theo staff_id kèm trace_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, mức chênh 6 điểm, ba luật dừng và ngày quyết định 2027-01-08 chốt trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 20 cụm mỗi nhóm, cỡ mẫu hiệu dụng tối đa 1.000 < 1.251, nên không phát hiện được mức chênh 5 điểm với power 0,8.
#   Nhóm chấp nhận mức chênh phát hiện được là 6 điểm (859 ca hiệu dụng mỗi nhóm, mỗi nhân viên ít nhất 299 yêu cầu).
#   Con số bất lợi: nếu tác động thật chỉ là 5 điểm thì power chỉ còn khoảng 0,64 (statsmodels NormalIndPower, n = 859),
#   tức khoảng 36% khả năng pilot kết luận "không thấy khác biệt" dù trợ lý có đạt đúng 5 điểm.
#   Không chọn chia theo yêu cầu (đủ 1.251 nhưng cùng một nhân viên vừa dùng vừa không dùng, tràn tác động cao)
#   và không chọn chia theo depot (tối đa 300, chỉ 6 cụm).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: Toàn mẫu 51/1.200 = 4,25%. Trong phạm vi noi_dia + hang_nang: 39/982 = 3,97%.
#   Ngưỡng an toàn: so với nhóm đối chứng, dừng khi nhóm trợ lý cao hơn từ 2 điểm trở lên, kèm trần tuyệt đối 6%.
#   Không dùng ngưỡng tuyệt đối 3% vì mức hiện tại 3,97% đã vượt, pilot sẽ bị dừng ngay tuần đầu.
#
# Số nền cho luật dùng: tỉ lệ bỏ qua gợi ý (quyet_dinh_xem_lai là sua hoặc bo, chia số ca được xem lại)
#   trong phạm vi noi_dia + hang_nang là 27/128 = 21,1% (toàn mẫu 48/177 = 27,1%).

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ loại noi_dia và hang_nang (chi phí mỗi việc thành công 2.696 đ = 0,22× và 8.221 đ = 0,69× so với 12.000 đ tự làm, simulated); loại quoc_te (22.515 đ = 1,88×, thành công 27,3%) và doi_tac (10.215 đ = 0,85×, thành công 54,4%). Cả 12 depot, 40 nhân viên CSKH."
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 20 cụm mỗi nhóm chỉ đủ cho 6 điểm, không đủ cho 5 điểm
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng; tương ứng 20 x 299 = 5.980 yêu cầu thực tế mỗi nhóm
    design_effect: 6.96           # 1 + (299 - 1) x 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng thời gian, cùng các depot với 20 nhân viên dùng trợ lý"
    spillover_risk: "Trung bình: nhân viên đối chứng có thể hỏi câu trả lời của đồng nghiệp cùng depot; giảm bằng cấp quyền theo tài khoản và log lượt mở trợ lý theo staff_id kèm trace_id, nhân viên đối chứng có lượt mở thì báo cáo riêng"
    predeclared: "Có: chỉ số chính, mức chênh 6 điểm, ba luật dừng, seed bốc thăm và ngày quyết định chốt trước ngày bắt đầu 2026-12-07"
  stop_rules:
    - "AN TOÀN · NẾU tỉ lệ mo_lai_trong_7_ngay của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên hoặc vượt 6%, hoặc có từ 1 ca hoàn tiền trùng cho cùng mã vận đơn TRONG 3 ngày liên tiếp (ca hoàn trùng: dừng ngay) THÌ Giám đốc vận hành tắt trợ lý cho toàn nhóm trong 30 phút và Kỹ sư trưởng agent rà trace_id các ca lỗi KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "CHI PHÍ · NẾU chi phí mỗi việc thành công kể cả chi phí cố định vượt 6.000 đ (mốc A4 là 4.599 đ ở đủ khối lượng và 5.784 đ ở nửa khối lượng, simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn 2 lần chạy (B3: 4.237 đ/việc, rẻ nhất cho cả hệ thống 6.901.220 đ) KHÔNG THÌ không được mở rộng sang thêm loại yêu cầu hay depot"
    - "MỨC ĐỘ SỬ DỤNG · NẾU tỉ lệ bỏ qua gợi ý (sửa hoặc bỏ, trên số ca được xem lại) vượt 40% (gần gấp đôi mức 21,1% trong đợt chạy thử) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn ít nhất 5 nhân viên nhóm trợ lý trong 3 ngày và gửi danh sách lý do cho PM trợ lý hoàn phí KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"   # mỗi ngày; không đọc chỉ số chính trước ngày quyết định
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý theo tài khoản, hiệu lực trong 30 phút; yêu cầu đang xử lý chuyển sang luồng nhân viên tự làm như trước pilot, kèm tóm tắt và trace_id để không phải hỏi lại khách"
  decision_date: "2027-01-08"     # bắt đầu 2026-12-07; đủ 20 người mỗi nhóm từ 2026-12-21; 10 ngày gom mẫu + 7 ngày theo dõi mở lại
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "lương nhân viên 2.000 đ/phút", "chi phí nhân viên tự làm 12.000 đ/yêu cầu", "chi phí cố định 40 triệu đ/tháng", "khối lượng 45.000 yêu cầu/tháng", "ICC 0,02", "baseline chỉ số chính 0,70", "chi phí mỗi việc thành công theo loại (A3) và kể cả cố định (A4)", "ngưỡng 6.000 đ trong luật dừng chi phí"]
